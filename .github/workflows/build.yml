name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create MSSQLLocalDB -s
          sqllocaldb info MSSQLLocalDB

      - name: Deploy database (schema, stored procedures, seed data)
        shell: pwsh
        run: .\scripts\Deploy-Database.ps1

      - name: Restore
        run: dotnet restore ContosoLegacyBank.sln

      - name: Build
        run: dotnet build ContosoLegacyBank.sln -c Release --no-restore

      - name: Test
        run: dotnet test ContosoLegacyBank.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
